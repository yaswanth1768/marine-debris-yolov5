<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Marine Debris Detection</title>

    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(120deg, #1cb5e0, #000851);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
      }

      .container {
        background: rgba(255, 255, 255, 0.15);
        padding: 30px;
        border-radius: 18px;
        width: 450px;
        text-align: center;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      }

      h1 {
        margin-bottom: 10px;
      }

      input[type="file"] {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        margin: 15px 0;
      }

      button {
        background: linear-gradient(135deg, #ff512f, #dd2476);
        border: none;
        padding: 14px;
        width: 100%;
        border-radius: 30px;
        color: white;
        font-size: 17px;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }

      img {
        width: 100%;
        border-radius: 12px;
        margin-top: 15px;
        border: 3px solid white;
      }

      footer {
        margin-top: 18px;
        font-size: 13px;
        opacity: 0.85;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🌊 Marine Debris Detection</h1>
      <p>Upload an image to detect plastic waste using YOLOv5</p>

      <form method="POST" enctype="multipart/form-data">
        <input type="file" name="image" required />
        <button type="submit">Detect Plastic</button>
      </form>

      {% if detected %}
      <h3>Detection Result</h3>
      <img src="/static/output/result.jpg" />
      {% endif %}

      <footer>AI for Environmental Sustainability 🌍</footer>
    </div>
  </body>
</html>
